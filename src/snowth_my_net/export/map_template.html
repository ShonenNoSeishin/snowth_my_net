<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { --bg:#f7f7f5; --panel:#ffffff; --text:#1f2328; --muted:#6b7280; --line:#9aa0a6;
          --accent:#2563eb; --border:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181d; --panel:#1f2229; --text:#e6e6e6; --muted:#9ca3af; --line:#6b7280;
            --accent:#60a5fa; --border:#2d313a; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
               font:14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:10px 16px;
           border-bottom:1px solid var(--border); background:var(--panel); }
  header h1 { font-size:16px; margin:0; }
  header .meta { color:var(--muted); font-size:12px; }
  header input { margin-left:auto; min-width:220px; padding:6px 10px; border-radius:6px;
                 border:1px solid var(--border); background:var(--bg); color:var(--text); }
  main { position:relative; height:calc(100% - 52px); }
  svg { width:100%; height:100%; display:block; cursor:grab; }
  svg.dragging { cursor:grabbing; }
  .edge { stroke:var(--line); stroke-width:1.5; }
  .edge.host { stroke-dasharray:3 3; stroke-width:1; }
  .edge-label { fill:var(--muted); font-size:9px; pointer-events:none; }
  .node circle, .node rect { stroke:var(--panel); stroke-width:2; }
  .node text { fill:var(--text); font-size:11px; pointer-events:none; }
  .node.external rect { fill:var(--panel); stroke:var(--line); stroke-dasharray:4 3; }
  .node.group rect, .node.host rect { fill:var(--panel); stroke:var(--border); }
  .node.dim { opacity:.2; } .edge.dim, .edge-label.dim { opacity:.1; }
  .node.hit circle, .node.hit rect { stroke:var(--accent); stroke-width:4; }
  aside { position:absolute; top:12px; right:12px; width:300px; max-width:calc(100% - 24px);
          background:var(--panel); border:1px solid var(--border); border-radius:8px;
          padding:12px 14px; box-shadow:0 4px 16px rgba(0,0,0,.12); }
  aside h2 { font-size:15px; margin:0 0 8px; }
  aside dl { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; margin:0; }
  aside dt { color:var(--muted); } aside dd { margin:0; overflow-wrap:anywhere; }
  aside button { float:right; border:none; background:none; color:var(--muted);
                 font-size:18px; cursor:pointer; }
  .legend { position:absolute; left:12px; bottom:12px; background:var(--panel);
            border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:12px; }
  .legend span { display:inline-flex; align-items:center; gap:4px; margin-right:10px; }
  .legend i { width:10px; height:10px; border-radius:50%; display:inline-block; }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1><span class="meta" id="meta"></span>
  <input id="search" type="search" placeholder="Search a device, port, MAC or IP…">
</header>
<main>
  <svg id="map" role="img" aria-label="network map"></svg>
  <aside id="panel" hidden></aside>
  <div class="legend" id="legend"></div>
</main>
<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  "use strict";
  const data = JSON.parse(document.getElementById("data").textContent);
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("map");
  document.getElementById("title").textContent = data.title;
  document.getElementById("meta").textContent =
    data.nodes.filter(n => n.kind === "device").length + " devices · " +
    data.edges.filter(e => e.kind === "link").length + " links · generated " + data.generated;

  // Deterministic force layout (seeded), computed once.
  let seed = 42;
  const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const byId = new Map();
  data.nodes.forEach((n, i) => {
    const angle = (i / Math.max(1, data.nodes.length)) * Math.PI * 2;
    n.x = Math.cos(angle) * 300 + rand() * 20; n.y = Math.sin(angle) * 300 + rand() * 20;
    n.vx = 0; n.vy = 0; byId.set(n.id, n);
  });
  const edges = data.edges.filter(e => byId.has(e.a) && byId.has(e.b));
  for (let step = 0; step < 400; step++) {
    const cool = 1 - step / 400;
    for (let i = 0; i < data.nodes.length; i++) {
      const a = data.nodes[i];
      for (let j = i + 1; j < data.nodes.length; j++) {
        const b = data.nodes[j];
        let dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy + 0.01;
        const f = 9000 / d2; const d = Math.sqrt(d2);
        dx /= d; dy /= d; a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
      }
    }
    edges.forEach(e => {
      const a = byId.get(e.a), b = byId.get(e.b);
      const want = e.kind === "host" ? 70 : 160;
      let dx = b.x - a.x, dy = b.y - a.y; const d = Math.sqrt(dx * dx + dy * dy) + 0.01;
      const f = (d - want) * 0.02; dx /= d; dy /= d;
      a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
    });
    data.nodes.forEach(n => {
      n.vx -= n.x * 0.002; n.vy -= n.y * 0.002;
      const v = Math.min(30 * cool + 1, Math.hypot(n.vx, n.vy));
      const len = Math.hypot(n.vx, n.vy) || 1;
      n.x += n.vx / len * v; n.y += n.vy / len * v; n.vx *= 0.5; n.vy *= 0.5;
    });
  }

  const view = { x: 0, y: 0, k: 1 };
  const root = document.createElementNS(NS, "g");
  svg.appendChild(root);
  const el = (name, attrs, parent) => {
    const node = document.createElementNS(NS, name);
    Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
    (parent || root).appendChild(node); return node;
  };
  const edgeEls = edges.map(e => ({
    e, line: el("line", { class: "edge " + e.kind }),
    text: e.kind === "link" ? el("text", { class: "edge-label", "text-anchor": "middle" }) : null,
  }));
  edgeEls.forEach(x => { if (x.text) x.text.textContent = x.e.label; });
  const nodeEls = data.nodes.map(n => {
    const g = el("g", { class: "node " + n.kind });
    if (n.kind === "device") {
      el("circle", { r: 14, fill: data.colors[n.type] || data.colors[""] }, g);
    } else {
      const w = Math.max(40, n.label.length * 6.2 + 12);
      el("rect", { x: -w / 2, y: -10, width: w, height: 20, rx: 5 }, g);
    }
    const t = el("text", { y: n.kind === "device" ? 28 : 4, "text-anchor": "middle" }, g);
    t.textContent = n.label;
    g.addEventListener("click", ev => { ev.stopPropagation(); show(n); });
    g.addEventListener("pointerdown", ev => startDrag(ev, n));
    return { n, g };
  });

  function render() {
    root.setAttribute("transform",
      `translate(${svg.clientWidth / 2 + view.x},${svg.clientHeight / 2 + view.y}) scale(${view.k})`);
    edgeEls.forEach(({ e, line, text }) => {
      const a = byId.get(e.a), b = byId.get(e.b);
      line.setAttribute("x1", a.x); line.setAttribute("y1", a.y);
      line.setAttribute("x2", b.x); line.setAttribute("y2", b.y);
      if (text) { text.setAttribute("x", (a.x + b.x) / 2); text.setAttribute("y", (a.y + b.y) / 2 - 4); }
    });
    nodeEls.forEach(({ n, g }) => g.setAttribute("transform", `translate(${n.x},${n.y})`));
  }

  function show(n) {
    const panel = document.getElementById("panel");
    panel.replaceChildren();
    const close = document.createElement("button"); close.textContent = "×";
    close.onclick = () => { panel.hidden = true; };
    const h = document.createElement("h2"); h.textContent = n.label;
    const dl = document.createElement("dl");
    const add = (k, v) => {
      const dt = document.createElement("dt"); dt.textContent = k;
      const dd = document.createElement("dd"); dd.textContent = v; dl.append(dt, dd);
    };
    Object.entries(n.details || {}).forEach(([k, v]) => add(k, v));
    edges.filter(e => e.a === n.id || e.b === n.id).forEach(e => {
      const other = byId.get(e.a === n.id ? e.b : e.a);
      add(e.kind === "link" ? "Link" : "Port", other.label + " · " + e.label);
    });
    panel.append(close, h, dl); panel.hidden = false;
  }

  let drag = null;
  function startDrag(ev, n) { ev.stopPropagation(); drag = { n, sx: ev.clientX, sy: ev.clientY }; }
  svg.addEventListener("pointerdown", ev => {
    drag = { pan: true, sx: ev.clientX, sy: ev.clientY }; svg.classList.add("dragging");
  });
  window.addEventListener("pointermove", ev => {
    if (!drag) return;
    const dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy;
    drag.sx = ev.clientX; drag.sy = ev.clientY;
    if (drag.pan) { view.x += dx; view.y += dy; } else { drag.n.x += dx / view.k; drag.n.y += dy / view.k; }
    render();
  });
  window.addEventListener("pointerup", () => { drag = null; svg.classList.remove("dragging"); });
  svg.addEventListener("wheel", ev => {
    ev.preventDefault();
    view.k = Math.min(4, Math.max(0.15, view.k * (ev.deltaY < 0 ? 1.1 : 0.9))); render();
  }, { passive: false });
  svg.addEventListener("click", () => { document.getElementById("panel").hidden = true; });
  window.addEventListener("resize", render);

  document.getElementById("search").addEventListener("input", ev => {
    const q = ev.target.value.trim().toLowerCase();
    const hits = new Set(data.nodes.filter(n => q && (n.label.toLowerCase().includes(q) ||
      Object.values(n.details || {}).some(v => String(v).toLowerCase().includes(q)))).map(n => n.id));
    nodeEls.forEach(({ n, g }) => {
      g.classList.toggle("hit", hits.has(n.id)); g.classList.toggle("dim", !!q && !hits.has(n.id));
    });
    edgeEls.forEach(({ e, line, text }) => {
      const dim = !!q && !(hits.has(e.a) || hits.has(e.b));
      line.classList.toggle("dim", dim); if (text) text.classList.toggle("dim", dim);
    });
  });

  const legend = document.getElementById("legend");
  const types = new Set(data.nodes.filter(n => n.kind === "device").map(n => n.type));
  [...types].sort().forEach(t => {
    const s = document.createElement("span"); const i = document.createElement("i");
    i.style.background = data.colors[t] || data.colors[""];
    s.append(i, document.createTextNode(t || "unknown type")); legend.append(s);
  });

  // Fit the drawing to the window.
  const xs = data.nodes.map(n => n.x), ys = data.nodes.map(n => n.y);
  if (xs.length) {
    const w = Math.max(...xs) - Math.min(...xs) + 200, h = Math.max(...ys) - Math.min(...ys) + 200;
    view.k = Math.min(2, Math.max(0.15, Math.min(svg.clientWidth / w, svg.clientHeight / h)));
    view.x = -((Math.max(...xs) + Math.min(...xs)) / 2) * view.k;
    view.y = -((Math.max(...ys) + Math.min(...ys)) / 2) * view.k;
  }
  render();
})();
</script>
</body>
</html>
