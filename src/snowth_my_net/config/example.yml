# snowth_my_net configuration — generated by `snowth_my_net init`.
#
# Rules of thumb:
# * Secrets (communities, SNMPv3 keys, tokens) NEVER go in this file. Use `*_file` (a path,
#   relative to general.secrets_dir when not absolute) or `*_env` (an environment variable).
# * Every default is generic. Anything specific to your site belongs here, not in the code.
# * Run `snowth_my_net check` after every change: it validates this file and tests each device.
# * Reference of every key: docs/en/config.md (docs/fr/config.md in French).
version: 1

general:
  # Paths. Precedence: command line > environment variable > this file > default.
  # state_dir: /var/lib/snowth_my_net           # $SNOWTH_STATE_DIR   (state.sqlite, lock, OUI)
  # output_dir: /var/lib/snowth_my_net/output   # $SNOWTH_OUTPUT_DIR  (CSV, JSON, maps)
  # secrets_dir: /etc/snowth_my_net/secrets     # $SNOWTH_SECRETS_DIR (base of relative *_file)
  # extensions_dir: ./extensions                # collectors and reports (*.yml), Python (*.py)
  # python_extensions: [host_storage]          # Python extensions are loaded by name only
  # log_file: /var/log/snowth_my_net.log        # in addition to stderr; rotated 10 MB x 5
  log_level: info
  language: auto                   # terminal interface: auto (from LANG) | fr | en
  device_name:
    strip_domain: first_dot        # first_dot | suffixes | none
    # domain_suffixes: [corp.example.com]
    duplicate_names: suffix_ip     # two devices named "Switch" -> "Switch (192.0.2.10)"
  lock_wait:
    collect: 60                    # seconds a collect waits for a running command
    default: 900                   # export / push / run wait longer (they share the 11:00 slot)
  retention_days: 90               # devices, links and run history not seen for that long
  snmp:
    timeout: 3                     # per request, seconds
    retries: 1
    probe_timeout: 2               # when trying credentials (no retry)
    max_repetitions: 25            # GETBULK size; lower it for fragile agents
    use_bulk: true                 # false = GETNEXT only (buggy agents)
    concurrency: 16                # devices polled in parallel
    per_device_concurrency: 1      # simultaneous requests to one device (1 = no burst)
    pace_ms: 0                     # minimum pause between two requests to one device
    table_timeout: 180             # budget per table; partial rows are kept
    device_timeout: 600            # budget per device; partial results are kept

# Ordered list: for each address, the remembered working credential is tried first, then
# every credential whose scope contains the address, in this order. SNMPv3 authPriv is
# strongly recommended; v2c sends its community in clear text.
credentials:
  - name: v3-main
    version: 3
    # scope: [192.0.2.0/24]        # default: every address
    username: snowth
    auth_protocol: sha256          # md5 | sha | sha224 | sha256 | sha384 | sha512
    auth_key_file: snmp_v3_auth    # relative to general.secrets_dir
    priv_protocol: aes128          # des | 3des | aes128 | aes192 | aes256 | aes192c | aes256c
    priv_key_file: snmp_v3_priv    # (aes192c/aes256c = Cisco-style key extension)
  # - name: v2c-legacy
  #   version: 2c
  #   scope: [198.51.100.0/24]
  #   community_env: SNOWTH_V2C_COMMUNITY

discovery:
  seeds: [192.0.2.1]               # IPs or host names; "host:port" for a non-standard port
  allowed: [192.0.2.0/24]          # nothing outside these ranges is ever queried
  exclude: []                      # addresses or ranges never queried
  follow_neighbors: true           # explore LLDP/CDP neighbours inside `allowed`
  max_depth: 3
  follow_capabilities: [bridge, router, wlan_ap]   # phones and stations are never probed
  sweep: []                        # ranges to probe actively (inside `allowed`); empty = off
  sweep_rate: 50                   # probes per second during a sweep
  forget_after_days: 90

# Per-device overrides, by IP or CIDR; the most specific entry wins, key by key.
devices: []
  # - address: 192.0.2.254
  #   type: firewall               # switch|router|firewall|wireless|server|printer|facility|other
  #   name: fw-main                # replaces sysName in every output
  #   features: {arp: force, fdb: off}      # auto | force | off, per function
  #   snmp: {max_repetitions: 10, pace_ms: 50}
  # - address: 192.0.2.0/26
  #   vlan_indexing: auto          # auto | cisco | off (Cisco per-VLAN bridge tables)
  #   vrfs: auto                   # auto | off | [blue, dmz] (ARP of non-global VRFs)
  #   uplinks: [Te1/1/1]           # ports that are always uplinks
  #   access_ports: [Po10]         # ports that are always access ports (server LACP bond)
  #   uplink_mac_threshold: 200
  # - address: 192.0.2.250         # virtual IP of a firewall cluster
  #   ha_mode: members             # members: poll the members, this VIP is an alias | vip
  # - address: 192.0.2.99
  #   tolerate_failure: true       # kept in outputs; its failure does not set exit code 1

nodes:
  uplink_mac_threshold: 50         # a port with more learned MACs is treated as an uplink
  lag_is_uplink: false             # LAG to a server is an access port
  ap_ports_are_access: true        # Wi-Fi clients are located on their AP's switch port
  uplink_fallback: false           # true: MACs seen only behind soft uplinks get that port
  include_unlocated: true          # rows without switch/port (ARP-only MACs)
  positions: all                   # all | current
  retention_days: 30
  prefer_ipv4: true
  current_ip_window: 24h
  transit_window: 30m             # a MAC seen on two access ports within this window stays
                                   # on the one with the fewest MACs (the other is a transit)
  ignore_macs: []
  # ignore_mac_prefixes defaults to the VRRP and HSRP virtual MAC ranges.

dns:
  enabled: true
  resolvers: []                    # empty = system resolver; e.g. [192.0.2.53]
  timeout: 2
  cache_ttl: 24h
  negative_ttl: 1h

oui:
  clean_names: true                # "Cisco Systems, Inc" -> "Cisco Systems"

export:
  files: [devices, nodes, links, snapshot, map]
  allow_empty: []                  # CSV files allowed to have no data row
  csv:
    line_terminator: crlf          # crlf (RFC 4180) | lf
  devices:
    include_type: true             # trailing "Device Type" column (empty = no sure evidence)
  map:
    formats: [dot, mmd, html]
    endpoints: none                # none | grouped | all

push:
  targets: []
  # - name: cmdb
  #   url: https://cmdb.example.com/api/import?format=nodes
  #   files: [devices, nodes]      # sent one by one, in this order
  #   auth:
  #     bearer_token_file: /run/secrets/cmdb_token
  #   headers: {}                  # e.g. {X-Api-Key: {file: /run/secrets/api_key}}
  #   tls_verify: true
  #   timeout: 120
  #   retries: 0                   # network errors, 429, 502, 503, 504 only
  #   wait: false                  # wait for a 202 job to finish (needs poll:)
  #   poll:
  #     url: https://cmdb.example.com/api/jobs/{id}
  #     id_field: id
  #     status_field: status
  #     pending: [queued, running]
  #     success: [done]

schedule:
  collect: "*/10 * * * *"          # often: firewalls expire ARP entries within minutes
  export_push: "0 11,18 * * *"
  # timezone: Europe/Brussels      # only used to interpret this schedule; outputs are UTC
  health_max_age: auto             # auto = twice the longest gap between two collects

# Read-only web interface: snowth_my_net web (in Docker: the "web" service of compose.yml).
# web:
#   bind: 127.0.0.1                # 0.0.0.0 only behind a reverse proxy: it has no login
#   port: 8080
#   node_limit: 2000               # rows sent to the browser on the Nodes page

