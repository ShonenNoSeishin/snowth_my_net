# snowth_my_net — Docker Compose
#
#   cp .env.example .env               # uncomment and adjust SNOWTH_UID/GID, TZ
#   mkdir -p config data output secrets
#
# Nothing here is meant to be edited: what differs from one site to another belongs to .env
# (ports, user), config/snowth_my_net.yml (devices, credentials) and secrets/ (their values).
# Anything else: compose.override.yml, which Compose merges on top of this file and git ignores.
#   docker compose run --rm snowth init --output /tmp/example.yml   (or copy the example)
#   docker compose run --rm snowth check
#   docker compose up -d
#
# Tests: docker compose --profile test run --rm tests
name: snowth_my_net

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - "no-new-privileges:true"
  init: true

services:
  snowth:
    <<: *hardening
    build:
      context: .
      target: runtime
    image: snowth_my_net:${SNOWTH_VERSION:-latest}
    user: "${SNOWTH_UID:-10001}:${SNOWTH_GID:-10001}"
    command: ["scheduler"]
    environment:
      TZ: ${TZ:-UTC}
      SNOWTH_COLLECT_ON_START: ${SNOWTH_COLLECT_ON_START:-true}
    volumes:
      - ./config/snowth_my_net.yml:/etc/snowth_my_net/config.yml:ro
      - ./config/extensions:/etc/snowth_my_net/extensions:ro
      - ./secrets:/run/secrets:ro        # every file you drop there, by name, nothing to declare
      - ./data:/var/lib/snowth_my_net
      - ./output:/output
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "snowth_my_net", "-q", "health"]
      interval: 5m
      timeout: 30s
      retries: 2
      start_period: 30m
    # No "ports:": nothing is exposed. SNMP (UDP/161) and HTTPS are outgoing only and leave
    # through the host's address (allow it in the SNMP ACLs of the devices).

  # Read-only web interface. It never writes: the scheduler above owns the state lock.
  web:
    <<: *hardening
    build:
      context: .
      target: runtime
    image: snowth_my_net:${SNOWTH_VERSION:-latest}
    user: "${SNOWTH_UID:-10001}:${SNOWTH_GID:-10001}"
    # 172.16.0.0/12 is where Docker puts its bridge networks: the interface then reads the
    # reader's own address from X-Forwarded-For instead of seeing every request come from nginx
    # (it would otherwise log one address for everybody, and lock everybody out together).
    command: ["web", "--bind", "0.0.0.0", "--port", "8080", "--trusted-proxy", "172.16.0.0/12"]
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./config/snowth_my_net.yml:/etc/snowth_my_net/config.yml:ro
      - ./config/extensions:/etc/snowth_my_net/extensions:ro
      - ./secrets:/run/secrets:ro
      - ./data:/var/lib/snowth_my_net          # read-only queries, but SQLite needs the mount
      - ./output:/output:ro
    # No "ports:": the nginx service below is the way in, over TLS. To reach the interface in
    # clear anyway (an SSH tunnel, another proxy), add the mapping in a compose.override.yml.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 1m
      timeout: 10s
      retries: 3

  # TLS front. It generates a self-signed certificate on first start (kept in a volume), so a
  # browser warns once: it protects the password and the session cookie from a passive listener,
  # it does not prove who answers. Drop your own certificate in the volume, or point it at one
  # from your CA, to get rid of the warning.
  nginx:
    build:
      context: ./nginx
    image: snowth_my_net-nginx:${SNOWTH_VERSION:-latest}
    environment:
      TZ: ${TZ:-UTC}
      SNOWTH_HTTPS_PORT: ${SNOWTH_HTTPS_PORT:-8443}    # for the redirect from the clear port
      SNOWTH_TLS_HOSTS: ${SNOWTH_TLS_HOSTS:-localhost,127.0.0.1}
    ports:
      - "${SNOWTH_HTTP_PORT:-8080}:80"                 # redirects to the address below
      - "${SNOWTH_HTTPS_PORT:-8443}:443"
    volumes:
      - certs_web:/etc/nginx/certs
    depends_on:
      - web
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "--no-check-certificate",
             "https://127.0.0.1/healthz"]
      interval: 1m
      timeout: 10s
      retries: 3

  # ------------------------------------------------------------------ test profile
  sim-access:
    profiles: [test]
    build: {context: ., target: test}
    command: ["python", "-m", "tests.support.sim_container", "sw-access"]
    networks:
      testnet: {ipv4_address: 172.31.250.11}

  sim-cisco:
    profiles: [test]
    build: {context: ., target: test}
    command: ["python", "-m", "tests.support.sim_container", "sw-cisco"]
    networks:
      testnet: {ipv4_address: 172.31.250.21}

  fakepush:
    profiles: [test]
    build: {context: ., target: test}
    command: ["python", "-m", "tests.support.fake_push", "--host", "172.31.250.30",
              "--port", "8443", "--cert-dir", "/certs", "--token", "compose-test-token"]
    volumes:
      - certs:/certs
    networks:
      testnet: {ipv4_address: 172.31.250.30}

  tests:
    profiles: [test]
    build: {context: ., target: test}
    depends_on: [sim-access, sim-cisco, fakepush]
    environment:
      SNOWTH_COMPOSE_TEST: "1"
    volumes:
      - certs:/certs:ro
    networks: [testnet]

# No "secrets:" block: ./secrets is mounted whole, read-only, on /run/secrets (the directory the
# image reads). A file named "community_office" there is reached by "community_file: community_office"
# in the configuration. Nothing in this file ever has to change when you add one.

volumes:
  certs: {}
  certs_web: {}        # the TLS certificate of the interface, generated on first start

networks:
  testnet:
    ipam:
      config:
        - subnet: 172.31.250.0/24
